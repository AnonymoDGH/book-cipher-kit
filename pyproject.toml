[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-cipher-kit"
version = "0.1.0"
description = "Encode and decode messages as positions inside a shared book — the cipher that needs no key."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["book-cipher", "cipher", "cryptography", "espionage", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
bookcipher = "book_cipher_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
